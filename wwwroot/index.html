<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiseHR</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="css/StyleSheet.css">
    <link rel="stylesheet" href="css/site.css">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <style>
        /* Optimized loading animation styles */
        .loading-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            perspective: 1000px;
            transition: opacity 0.5s ease-out;
        }

            .loading-animation.hidden {
                opacity: 0;
                pointer-events: none;
            }

        .loading-logo {
            width: 200px;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

            .loading-logo:hover {
                transform: translateX(-50%) scale(1.08);
                filter: drop-shadow(0 4px 12px rgba(170, 16, 208, 0.2));
            }

        .content {
            position: relative;
            margin-top: 120px;
        }

            .content h2 {
                color: #aa10d0;
                font-size: 7em;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                font-family: 'Poppins', sans-serif !important;
                white-space: nowrap;
                font-weight: 700;
                letter-spacing: -2px;
                backface-visibility: hidden;
            }

                .content h2:nth-child(1) {
                    color: transparent;
                    -webkit-text-stroke: 3px #aa10d0;
                    z-index: 2;
                }

                .content h2:nth-child(2) {
                    color: #d58aeb;
                    animation: animate 3.5s ease-in-out infinite;
                    transform: translate(-50%, -50%) translateZ(0);
                    z-index: 1;
                }

        @keyframes animate {
            0%, 100% {
                clip-path: polygon( 0% 45%, 20% 44%, 40% 50%, 60% 58%, 80% 55%, 100% 50%, 100% 100%, 0% 100% );
                transform: translate(-50%, -50%) scale(1) translateZ(0);
            }

            50% {
                clip-path: polygon( 0% 55%, 20% 60%, 40% 62%, 60% 55%, 80% 48%, 100% 50%, 100% 100%, 0% 100% );
                transform: translate(-50%, -50%) scale(1.02) translateZ(0);
            }
        }

        /* Ensure the main content is scrollable */
        body {
            overflow: auto;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Blazor error UI should be above everything */
        #blazor-error-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Loading Animation -->
    <div id="app-loading" class="loading-animation">
        <img src="/assets/wwlogo.png" alt="WiseHR Logo" class="loading-logo">
        <div class="content">
            <h2>WISEONE</h2>
            <h2>WISEONE</h2>
        </div>
    </div>
    <!-- Main app content container -->
    <div id="app" style="display: none;"></div>

    <!-- Existing error UI -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Scripts -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_framework/blazor.server.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="scripts/localStorage.js"></script>
    <script src="scripts/sessionStorage.js"></script>
    <script src="scripts/pdfScroll.js"></script>
    <script type="module" src="storage.js"></script>
    <script src="js/fileDownload.js"></script>
    <script src="scripts/fileOperations.js"></script>

    <script>
        window.downloadBase64File = (contentType, base64Data, fileName) => {
            const linkSource = `data:${contentType};base64,${base64Data}`;
            const downloadLink = document.createElement("a");
            downloadLink.href = linkSource;
            downloadLink.download = fileName;
            downloadLink.click();
        };


        // Hide loading animation when Blazor is ready
        window.addEventListener('load', function () {
            // This will be called when the page loads, but we also need to wait for Blazor
            setTimeout(function () {
                const loadingElement = document.getElementById('app-loading');
                const appElement = document.getElementById('app');

                if (loadingElement) {
                    loadingElement.classList.add('hidden');
                    // Remove the element after the transition completes
                    setTimeout(() => {
                        loadingElement.remove();
                        appElement.style.display = 'block';
                    }, 500);
                }
            }, 1000); // Minimum show time for the loading animation
        });

        // Alternative approach for Blazor-specific loading
        window.blazorLoaded = false;
        window.addEventListener('blazor-loaded', function () {
            window.blazorLoaded = true;
            const loadingElement = document.getElementById('app-loading');
            const appElement = document.getElementById('app');

            if (loadingElement) {
                loadingElement.classList.add('hidden');
                setTimeout(() => {
                    loadingElement.remove();
                    appElement.style.display = 'block';
                }, 500);
            }
        });
    </script>

    <!-- Add the downloadFile function here -->
    <script>
        window.downloadFile = function (fileName, contentType, content) {
            const linkSource = `data:${contentType};base64,${content}`;
            const downloadLink = document.createElement("a");
            downloadLink.href = linkSource;
            downloadLink.download = fileName;
            downloadLink.click();
        };

        // File upload handling
        window.handleFileUpload = function (inputElement) {
            return new Promise((resolve, reject) => {
                const file = inputElement.files[0];
                if (!file) {
                    reject("No file selected");
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    // Get the binary data from the ArrayBuffer
                    const arrayBuffer = e.target.result;
                    resolve({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        content: arrayBuffer
                    });
                };
                reader.onerror = function (e) {
                    reject("Error reading file");
                };
                // Read as ArrayBuffer instead of DataURL
                reader.readAsArrayBuffer(file);
            });
        };

        // File download handling
        window.downloadFileFromStream = function (fileName, contentStream) {
            const blob = new Blob([contentStream]);
            const url = window.URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName;
            anchorElement.click();
            anchorElement.remove();
            window.URL.revokeObjectURL(url);
        };

        // Add this new function for handling file uploads
        window.triggerFileInput = function (inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.click();
            }
        };
    </script>

    <script>
        window.openPdfInNewTab = function (dataUrl, fileName) {
            // Create a new window with a simple iframe
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <iframe 
                    src="${dataUrl}" 
                    style="width:100%;height:100vh;border:none;"
                    title="${fileName}"
                ></iframe>
            `);
            newWindow.document.close();
        };
    </script>
</body>
</html>
