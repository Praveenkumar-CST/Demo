pr:
  branches:
    include:
      - dev-deployment-25/04

trigger:
  branches:
    include:
      - dev-deployment-25/04

variables:
  buildConfiguration: 'Release'
  project: 'WiseHR.csproj'
  buildPlatform: 'Any CPU'
  vmImage: 'ubuntu-latest'
  
parameters:
- name: agentSelection
  displayName: 'Select Agent'
  type: string
  default: 'Self Hosted Agent'
  values:
  - 'Microsoft Hosted Agent'
  - 'Self Hosted Agent'

jobs:
- job: deploy_wisehr_frontend
  displayName: 'Deploy WiseHR Frontend'
  pool:
    ${{ if eq(parameters.agentSelection, 'Microsoft Hosted Agent') }}:
      vmImage: ${{ variables.vmImage }}
    ${{ if eq(parameters.agentSelection, 'Self Hosted Agent') }}:
      name: 'Pool1-selfhosted-ww'

  steps:
  - checkout: self
    persistCredentials: true

  # Install required .NET SDK
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.x'
    displayName: 'Install .NET SDK 9.x'

  # Install NuGet
  - task: NuGetToolInstaller@1
    inputs:
      versionSpec: '6.x'
    displayName: 'Install NuGet'

  # Restore NuGet packages
  - task: DotNetCoreCLI@2
    inputs:
      command: 'restore'
      projects: '$(project)'
      arguments: '--verbosity detailed'
    displayName: 'Restore NuGet Packages'

  # Build project
  - task: DotNetCoreCLI@2
    inputs:
      command: 'build'
      projects: '$(project)'
      arguments: '--configuration $(buildConfiguration)'
    displayName: 'Build WiseHR Project'

  # Publish project to a subfolder (to clearly separate output)
  - task: DotNetCoreCLI@2
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(project)'
      arguments: '--no-restore --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
      zipAfterPublish: false
    displayName: 'Publish WiseHR Project'

  # Publish artifacts for Azure DevOps (optional but good practice)
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
      ArtifactName: 'drop'
      publishLocation: 'Container'
    displayName: 'Publish Artifacts'

  # Upload to Azure Blob Storage
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'Microsoft Azure Sponsorship(9835c61d-6a4a-454e-8d09-1b383899f7ab)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Checking AzCopy Version..."
        azcopy --version

        echo "Deleting old blobs from \$web container..."
        azcopy rm "https://wisehrmain.blob.core.windows.net/\$web?$(STORAGE_ACCOUNT_MAIN_SAS)" --recursive=true

        echo "Uploading new blobs from published folder..."
        azcopy copy "$(Build.ArtifactStagingDirectory)/publish/wwwroot/*" "https://wisehrmain.blob.core.windows.net/\$web?$(STORAGE_ACCOUNT_MAIN_SAS)" --recursive=true --overwrite=true

        echo "Blob Storage deployment completed."
    displayName: 'Upload Frontend to Azure Blob Storage'

  # Azure Front Door Cache Invalidation
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'Microsoft Azure Sponsorship(9835c61d-6a4a-454e-8d09-1b383899f7ab)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Purging Azure Front Door Cache..."
        az afd endpoint purge \
          --resource-group wise-migrate-rg \
          --profile-name WiseMigrateFrontdoor \
          --content-paths '/*' \
          --endpoint-name wisehrmain \
          --domains wisehr.wisework.in wisehrmain-h0exgzg0eze9e9bj.z02.azurefd.net
    displayName: 'Purge Azure Front Door Cache'
